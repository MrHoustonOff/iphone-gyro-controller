<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="live_debug.title">3D Live Debug</title>
  <link rel="stylesheet" href="main.css">
  <style>
    /* ── Authentic Apple HIG Desktop Window Layout ───────────────────────────── */
    body {
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      font-family: var(--font-sans);
      transition: background-color var(--transition-theme), color var(--transition-theme);
    }

    .app-header {
      height: 64px;
      min-height: 64px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      flex-shrink: 0;
      transition: background-color var(--transition-theme), border-color var(--transition-theme);
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .brand-badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--apple-blue);
    }

    /* ── Split 50/50 Workspace ────────────────────────────────────────────────── */
    .split-workspace {
      display: flex;
      flex: 1;
      width: 100vw;
      height: calc(100vh - 64px);
      overflow: hidden;
    }

    /* ── Left Controls Panel (50%) ── */
    .left-controls {
      width: 50%;
      height: 100%;
      padding: clamp(20px, 3.5vh, 32px) clamp(20px, 3.5vw, 36px);
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border-right: 1px solid var(--border);
      background-color: var(--bg);
      box-sizing: border-box;
      transition: background-color var(--transition-theme), border-color var(--transition-theme);
    }

    .controls-inner {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: 0 auto;
    }

    /* Apple Inset Grouped Card */
    .apple-group-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 22px;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: background-color var(--transition-theme), border-color var(--transition-theme), box-shadow var(--transition-theme);
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .control-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }

    .control-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
      line-height: 1.3;
    }

    .control-desc {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    /* Standard Apple iOS Toggle Switch */
    .apple-switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 28px;
      flex-shrink: 0;
    }

    .apple-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .apple-slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--surface-hover);
      border: 1px solid var(--border);
      transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: var(--radius-pill);
    }

    .apple-slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 2px;
      bottom: 2px;
      background-color: #FFFFFF;
      transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.28);
    }

    input:checked + .apple-slider {
      background-color: var(--apple-blue);
      border-color: var(--apple-blue);
    }

    input:checked + .apple-slider:before {
      transform: translateX(20px);
    }

    /* Apple Recenter Pill Action Button */
    .btn-recenter-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 11px 18px;
      background: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      border: none;
      border-radius: var(--radius-pill);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
    }

    .btn-recenter-action:hover {
      background: var(--btn-primary-hover);
      transform: translateY(-1px);
    }

    .btn-recenter-action:active {
      transform: translateY(0);
    }

    .apple-kbd {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 5px;
      background: rgba(0, 0, 0, 0.14);
      color: inherit;
      border: 1px solid rgba(0, 0, 0, 0.12);
    }

    [data-theme="dark"] .apple-kbd {
      background: rgba(0, 0, 0, 0.24);
      border-color: rgba(0, 0, 0, 0.2);
    }

    /* ── Right 3D Viewport (50%) ──────────────────────────────────────────────── */
    .right-viewport {
      position: relative;
      width: 50%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      transition: background-color var(--transition-theme);
    }

    #livedebug-canvas {
      width: 100%;
      height: 100%;
      display: block;
      transition: filter 0.25s ease, transform 0.25s ease;
    }

    #livedebug-canvas.blurred {
      filter: blur(16px) brightness(0.72);
      transform: scale(0.985);
      pointer-events: none;
    }

    /* Eco Paused Frosted Glass Overlay */
    .eco-overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.22s ease;
    }

    [data-theme="light"] .eco-overlay {
      background: rgba(242, 242, 247, 0.55);
    }

    .eco-overlay.visible {
      display: flex;
      opacity: 1;
    }

    .eco-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 22px 28px;
      text-align: center;
      max-width: 300px;
      box-shadow: var(--card-shadow);
      transition: transform var(--transition-fast);
    }

    .eco-card:hover {
      transform: translateY(-2px);
    }

    .eco-icon {
      width: 34px;
      height: 34px;
      margin: 0 auto 10px;
      color: var(--text-secondary);
    }

    .eco-title {
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
      margin-bottom: 5px;
    }

    .eco-hint {
      display: inline-block;
      font-size: 12px;
      color: var(--apple-blue);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Apple Header Bar -->
  <header class="app-header">
    <div class="header-left">
      <div class="brand-title">
        <span>GyroBridge</span>
        <span class="brand-badge">Live Debug</span>
      </div>
      <div class="status-capsule online" id="status-capsule">
        <span class="status-dot" id="status-dot"></span>
        <span id="fps-counter" class="status-text">60 fps</span>
      </div>
    </div>

    <div class="header-right">
      <!-- Apple RU / EN Segmented Control -->
      <div class="segmented-control" id="lang-control">
        <button type="button" class="segmented-btn" id="lang-ru">RU</button>
        <button type="button" class="segmented-btn" id="lang-en">EN</button>
      </div>

      <!-- Apple Theme Switcher Button -->
      <button type="button" class="btn-icon" id="btn-theme-toggle" data-i18n-title="app.theme_toggle" title="Переключить тему">
        <svg id="icon-theme-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2"></path>
          <path d="M12 20v2"></path>
          <path d="m4.93 4.93 1.41 1.41"></path>
          <path d="m17.66 17.66 1.41 1.41"></path>
          <path d="M2 12h2"></path>
          <path d="M20 12h2"></path>
          <path d="m6.34 17.66-1.41 1.41"></path>
          <path d="m19.07 4.93-1.41 1.41"></path>
        </svg>
        <svg id="icon-theme-moon" viewBox="0 0 24 24" style="display: none;">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Split 50/50 Workspace -->
  <main class="split-workspace">

    <!-- Left Controls Panel (50%) -->
    <aside class="left-controls">
      <div class="controls-inner">

        <!-- 3D Model Picker -->
        <section class="apple-group-card">
          <div class="control-row">
            <div class="control-info">
              <span class="control-title" data-i18n="live_debug.model_select">3D-модель</span>
              <span class="control-desc" data-i18n="live_debug.model_desc">Выбор объекта отображения</span>
            </div>
            <div class="segmented-control" id="model-segmented">
              <button type="button" class="segmented-btn active" id="btn-model-gamepad" data-i18n="live_debug.model_gamepad">Геймпад</button>
              <button type="button" class="segmented-btn" id="btn-model-cube" data-i18n="live_debug.model_cube">Кубик</button>
            </div>
          </div>
        </section>

        <!-- Resource Saving (Apple Toggle Switch) -->
        <section class="apple-group-card">
          <div class="control-row">
            <div class="control-info">
              <span class="control-title" data-i18n="live_debug.eco_mode">Экономия ресурсов</span>
              <span class="control-desc" data-i18n="live_debug.eco_desc">Приостанавливать рендеринг при неактивном окне</span>
            </div>
            <label class="apple-switch">
              <input type="checkbox" id="eco-toggle" checked>
              <span class="apple-slider"></span>
            </label>
          </div>
        </section>

        <!-- Calibration Recenter Action -->
        <section class="apple-group-card">
          <div class="control-info" style="margin-bottom: 2px;">
            <span class="control-title" data-i18n="live_debug.recenter">Центрировать</span>
            <span class="control-desc" data-i18n="live_debug.recenter_desc">Мгновенно сбрасывает виртуальное положение к исходному</span>
          </div>
          <button type="button" class="btn-recenter-action" id="btn-recenter">
            <kbd class="apple-kbd" data-i18n="live_debug.recenter_hint">Пробел</kbd>
            <span data-i18n="live_debug.recenter">Центрировать</span>
          </button>
        </section>

      </div>
    </aside>

    <!-- Right 3D Viewport (50%) -->
    <section class="right-viewport" id="viewport-wrap">
      <canvas id="livedebug-canvas"></canvas>

      <!-- Eco Paused Overlay -->
      <div class="eco-overlay" id="eco-overlay" title="Кликните для возобновления">
        <div class="eco-card">
          <svg class="eco-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
          <div class="eco-title" data-i18n="live_debug.paused_title">Рендеринг приостановлен</div>
          <div class="eco-hint" data-i18n="live_debug.paused_hint">Кликните для возобновления</div>
        </div>
      </div>
    </section>

  </main>

  <!-- Scripts -->
  <script src="assets/three.min.js"></script>
  <script src="assets/GLTFLoader.js"></script>

  <script>
    (function() {
      // ── Bilingual Dictionary Engine ──
      const DICTIONARY = {
        ru: {
          "live_debug.title": "3D Live Debug",
          "live_debug.model_select": "3D-модель",
          "live_debug.model_desc": "Выбор объекта отображения",
          "live_debug.model_gamepad": "Геймпад",
          "live_debug.model_cube": "Кубик",
          "live_debug.eco_mode": "Экономия ресурсов",
          "live_debug.eco_desc": "Приостанавливать рендеринг при неактивном окне",
          "live_debug.recenter": "Центрировать",
          "live_debug.recenter_desc": "Мгновенно сбрасывает виртуальное положение к исходному",
          "live_debug.recenter_hint": "Пробел",
          "live_debug.paused_title": "Рендеринг приостановлен",
          "live_debug.paused_hint": "Кликните для возобновления",
          "live_debug.status_online": "в сети",
          "live_debug.status_offline": "нет связи",
          "app.theme_toggle": "Переключить тему"
        },
        en: {
          "live_debug.title": "3D Live Debug",
          "live_debug.model_select": "3D Model",
          "live_debug.model_desc": "Select orientation model",
          "live_debug.model_gamepad": "Gamepad",
          "live_debug.model_cube": "Cube",
          "live_debug.eco_mode": "Resource Saving",
          "live_debug.eco_desc": "Pause rendering when window is inactive",
          "live_debug.recenter": "Recenter",
          "live_debug.recenter_desc": "Instantly resets virtual orientation to neutral baseline",
          "live_debug.recenter_hint": "Space",
          "live_debug.paused_title": "Rendering paused",
          "live_debug.paused_hint": "Click to resume",
          "live_debug.status_online": "online",
          "live_debug.status_offline": "offline",
          "app.theme_toggle": "Toggle Theme"
        }
      };

      let currentLang = localStorage.getItem('gb_lang') || 'ru';

      function applyLang(lang) {
        currentLang = lang;
        localStorage.setItem('gb_lang', lang);

        document.getElementById('lang-ru')?.classList.toggle('active', lang === 'ru');
        document.getElementById('lang-en')?.classList.toggle('active', lang === 'en');

        const dict = DICTIONARY[lang] || DICTIONARY.ru;
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (dict[key]) el.textContent = dict[key];
        });
        document.querySelectorAll('[data-i18n-title]').forEach(el => {
          const key = el.getAttribute('data-i18n-title');
          if (dict[key]) el.title = dict[key];
        });
      }

      function setLangAndSync(lang) {
        applyLang(lang);
        fetch('http://127.0.0.1:8080/livedebug/lang?value=' + encodeURIComponent(lang), { method: 'POST' }).catch(() => {});
      }

      document.getElementById('lang-ru')?.addEventListener('click', () => setLangAndSync('ru'));
      document.getElementById('lang-en')?.addEventListener('click', () => setLangAndSync('en'));

      // ── Theme Manager ──
      let currentTheme = localStorage.getItem('gb_theme') || 'dark';

      function applyTheme(theme, broadcast = false) {
        currentTheme = theme;
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('gb_theme', theme);

        const sunIcon = document.getElementById('icon-theme-sun');
        const moonIcon = document.getElementById('icon-theme-moon');
        if (theme === 'dark') {
          if (sunIcon) sunIcon.style.display = 'block';
          if (moonIcon) moonIcon.style.display = 'none';
        } else {
          if (sunIcon) sunIcon.style.display = 'none';
          if (moonIcon) moonIcon.style.display = 'block';
        }

        if (window.go?.main?.LiveDebugApp?.SetWindowTheme) {
          try { window.go.main.LiveDebugApp.SetWindowTheme(theme); } catch (e) {}
        }

        update3DTheme(theme);

        if (broadcast) {
          fetch('http://127.0.0.1:8080/livedebug/theme?value=' + encodeURIComponent(theme), { method: 'POST' }).catch(() => {});
        }
      }

      document.getElementById('btn-theme-toggle')?.addEventListener('click', () => {
        applyTheme(currentTheme === 'dark' ? 'light' : 'dark', true);
      });

      // ── DOM Elements ──
      const canvas = document.getElementById('livedebug-canvas');
      const viewportWrap = document.getElementById('viewport-wrap');
      const ecoOverlay = document.getElementById('eco-overlay');
      const ecoToggle = document.getElementById('eco-toggle');
      const fpsCounter = document.getElementById('fps-counter');
      const statusDot = document.getElementById('status-dot');
      const statusCapsule = document.getElementById('status-capsule');
      const btnRecenter = document.getElementById('btn-recenter');
      const btnModelGamepad = document.getElementById('btn-model-gamepad');
      const btnModelCube = document.getElementById('btn-model-cube');

      // ── Three.js Studio Scene ──
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();

      // Camera: spacious Apple Keynote framing
      const camera = new THREE.PerspectiveCamera(28, 1, 0.2, 50);
      const camTarget = new THREE.Vector3(0, 0, 0);
      const orbitHRadius = 9.8;
      const orbitY = 4.2;
      camera.position.set(camTarget.x, orbitY, camTarget.z + orbitHRadius);
      camera.lookAt(camTarget);

      // Studio Lighting
      const ambLight = new THREE.AmbientLight(0xffffff, 0.90);
      scene.add(ambLight);

      const mainLight = new THREE.DirectionalLight(0xffffff, 1.30);
      mainLight.position.set(3.5, 9.5, 4.5);
      mainLight.castShadow = true;
      mainLight.shadow.mapSize.width = 1024;
      mainLight.shadow.mapSize.height = 1024;
      mainLight.shadow.camera.near = 0.5;
      mainLight.shadow.camera.far = 25;
      mainLight.shadow.camera.left = -4;
      mainLight.shadow.camera.right = 4;
      mainLight.shadow.camera.top = 4;
      mainLight.shadow.camera.bottom = -4;
      mainLight.shadow.bias = -0.001;
      scene.add(mainLight);

      const fillLight = new THREE.DirectionalLight(0x8eb6ff, 0.50);
      fillLight.position.set(-3.5, 6, 3.5);
      scene.add(fillLight);

      const rimLight = new THREE.DirectionalLight(0x007aff, 0.90);
      rimLight.position.set(0, -2, -5);
      scene.add(rimLight);

      // Floor Radial Grid Texture (Lowered to y = -1.6 for comfortable clearance)
      const FLOOR_Y = -1.6;

      function createRadialGridTexture(isDark) {
        const size = 1024;
        const cvs = document.createElement('canvas');
        cvs.width = size;
        cvs.height = size;
        const ctx = cvs.getContext('2d');
        const center = size / 2;

        // 1. Concentric distance rings
        ctx.strokeStyle = isDark ? 'rgba(255, 255, 255, 0.24)' : 'rgba(0, 0, 0, 0.16)';
        ctx.lineWidth = 1.8;
        for (let r = 48; r < center; r += 48) {
          ctx.beginPath();
          ctx.arc(center, center, r, 0, Math.PI * 2);
          ctx.stroke();
        }

        // 2. High-contrast Key Highlight Rings
        const highlightRings = [center * 0.35, center * 0.65, center * 0.90];
        ctx.lineWidth = 3.0;
        ctx.strokeStyle = isDark ? 'rgba(56, 189, 248, 0.90)' : 'rgba(0, 113, 227, 0.80)';
        highlightRings.forEach(r => {
          ctx.beginPath();
          ctx.arc(center, center, r, 0, Math.PI * 2);
          ctx.stroke();
        });

        // 3. Diagonal 45-degree angle guides
        ctx.lineWidth = 1.4;
        ctx.strokeStyle = isDark ? 'rgba(255, 255, 255, 0.16)' : 'rgba(0, 0, 0, 0.12)';
        const diagDist = center * 0.95;
        const diagCos = Math.cos(Math.PI / 4) * diagDist;
        const diagSin = Math.sin(Math.PI / 4) * diagDist;

        ctx.beginPath();
        ctx.moveTo(center - diagCos, center - diagSin);
        ctx.lineTo(center + diagCos, center + diagSin);
        ctx.moveTo(center - diagCos, center + diagSin);
        ctx.lineTo(center + diagCos, center - diagSin);
        ctx.stroke();

        // 4. Bold Cartesian Crosshairs / Coordinate Axes
        ctx.lineWidth = 3.6;
        ctx.strokeStyle = isDark ? 'rgba(56, 189, 248, 1.0)' : 'rgba(0, 113, 227, 0.95)';
        ctx.beginPath();
        ctx.moveTo(center, center - center * 0.95);
        ctx.lineTo(center, center + center * 0.95);
        ctx.moveTo(center - center * 0.95, center);
        ctx.lineTo(center + center * 0.95, center);
        ctx.stroke();

        // 5. Smooth radial edge falloff mask
        ctx.globalCompositeOperation = 'destination-in';
        const grad = ctx.createRadialGradient(center, center, 0, center, center, center * 0.98);
        grad.addColorStop(0.0, 'rgba(0,0,0,1)');
        grad.addColorStop(0.72, 'rgba(0,0,0,1)');
        grad.addColorStop(0.90, 'rgba(0,0,0,0.65)');
        grad.addColorStop(1.0, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, size, size);

        const tex = new THREE.CanvasTexture(cvs);
        tex.anisotropy = 8;
        return tex;
      }

      let gridTex = createRadialGridTexture(currentTheme === 'dark');
      const gridMat = new THREE.MeshBasicMaterial({
        map: gridTex,
        transparent: true,
        depthWrite: false,
        opacity: 1.0
      });
      const gridFloor = new THREE.Mesh(new THREE.PlaneGeometry(9.2, 9.2), gridMat);
      gridFloor.rotation.x = -Math.PI / 2;
      gridFloor.position.y = FLOOR_Y;
      gridFloor.renderOrder = 2;
      scene.add(gridFloor);

      // Realistic Soft Shadow Receiver Plane (Rendered under luminous grid lines)
      const shadowMat = new THREE.ShadowMaterial({
        opacity: (currentTheme === 'dark') ? 0.40 : 0.22,
        transparent: true
      });
      const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(9.2, 9.2), shadowMat);
      shadowPlane.rotation.x = -Math.PI / 2;
      shadowPlane.position.y = FLOOR_Y - 0.002;
      shadowPlane.receiveShadow = true;
      shadowPlane.renderOrder = 1;
      scene.add(shadowPlane);

      function update3DTheme(theme) {
        const isDark = (theme === 'dark');
        ambLight.intensity = isDark ? 0.90 : 1.0;
        mainLight.intensity = isDark ? 1.30 : 1.20;
        fillLight.color.setHex(isDark ? 0x8eb6ff : 0xc8ddff);
        fillLight.intensity = isDark ? 0.50 : 0.42;
        rimLight.color.setHex(isDark ? 0x007aff : 0x409cff);
        rimLight.intensity = isDark ? 0.90 : 0.60;

        shadowMat.opacity = isDark ? 0.40 : 0.22;
        shadowMat.needsUpdate = true;

        if (gridTex) gridTex.dispose();
        gridTex = createRadialGridTexture(isDark);
        gridMat.map = gridTex;
        gridMat.needsUpdate = true;
      }

      // ── Model 1: Gamepad ──
      const gamepadGroup = new THREE.Group();
      scene.add(gamepadGroup);

      const appleGamepadMaterial = new THREE.MeshStandardMaterial({
        color: 0x282a30,
        roughness: 0.92,
        metalness: 0.0,
      });

      if (window.THREE && window.THREE.GLTFLoader) {
        const loader = new THREE.GLTFLoader();
        loader.load(
          'assets/models/gamepad.glb',
          (gltf) => {
            const raw = gltf.scene;
            raw.rotation.y = -Math.PI * 0.5;
            raw.updateMatrixWorld(true);

            const box = new THREE.Box3().setFromObject(raw);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z) || 1;
            const targetScale = 2.05 / maxDim;
            raw.scale.set(targetScale, targetScale, targetScale);
            raw.updateMatrixWorld(true);

            const finalBox = new THREE.Box3().setFromObject(raw);
            const center = finalBox.getCenter(new THREE.Vector3());
            raw.position.sub(center);

            raw.traverse((child) => {
              if (child.isMesh) {
                child.material = appleGamepadMaterial;
                child.castShadow = true;
                child.receiveShadow = false;
              }
            });
            gamepadGroup.add(raw);
          },
          undefined,
          (err) => {
            console.warn('Fallback: Gamepad model load error, creating fallback mesh:', err);
            const fallbackMesh = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.4, 1.0), appleGamepadMaterial);
            fallbackMesh.castShadow = true;
            gamepadGroup.add(fallbackMesh);
          }
        );
      }

      // ── Model 2: Labeled Orientation Cube ──
      const cubeGroup = new THREE.Group();
      cubeGroup.visible = false;
      scene.add(cubeGroup);

      function createFaceTexture(text, bgColor) {
        const size = 512;
        const cvs = document.createElement('canvas');
        cvs.width = size; cvs.height = size;
        const ctx = cvs.getContext('2d');

        // Background
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, size, size);

        // Subtle inner border
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.lineWidth = 14;
        ctx.strokeRect(10, 10, size - 20, size - 20);

        // Center Text
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 80px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, size / 2, size / 2);

        const tex = new THREE.CanvasTexture(cvs);
        tex.anisotropy = 8;
        return tex;
      }

      // Cube faces: Right (+X), Left (-X), Top (+Y), Down (-Y), Front (+Z), Back (-Z)
      const cubeMaterials = [
        new THREE.MeshStandardMaterial({ map: createFaceTexture('RIGHT', '#E53935'), roughness: 0.6 }),
        new THREE.MeshStandardMaterial({ map: createFaceTexture('LEFT', '#8E24AA'), roughness: 0.6 }),
        new THREE.MeshStandardMaterial({ map: createFaceTexture('TOP', '#43A047'), roughness: 0.6 }),
        new THREE.MeshStandardMaterial({ map: createFaceTexture('DOWN', '#546E7A'), roughness: 0.6 }),
        new THREE.MeshStandardMaterial({ map: createFaceTexture('FRONT', '#1E88E5'), roughness: 0.6 }),
        new THREE.MeshStandardMaterial({ map: createFaceTexture('BACK', '#FB8C00'), roughness: 0.6 }),
      ];

      const cubeMesh = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 1.6), cubeMaterials);
      cubeMesh.castShadow = true;
      cubeMesh.receiveShadow = false;
      cubeGroup.add(cubeMesh);

      // Model Switcher Logic
      let currentModel = localStorage.getItem('gb_debug_model') || 'gamepad';

      function applyModel(model) {
        currentModel = model;
        localStorage.setItem('gb_debug_model', model);

        if (model === 'cube') {
          gamepadGroup.visible = false;
          cubeGroup.visible = true;
          btnModelGamepad?.classList.remove('active');
          btnModelCube?.classList.add('active');
        } else {
          gamepadGroup.visible = true;
          cubeGroup.visible = false;
          btnModelGamepad?.classList.add('active');
          btnModelCube?.classList.remove('active');
        }
      }

      btnModelGamepad?.addEventListener('click', () => applyModel('gamepad'));
      btnModelCube?.addEventListener('click', () => applyModel('cube'));
      applyModel(currentModel);

      // ── Quaternions and Tracking ──
      const liveQuat = new THREE.Quaternion();
      const currentQuat = new THREE.Quaternion();

      function resize() {
        if (!viewportWrap) return;
        const w = viewportWrap.clientWidth;
        const h = viewportWrap.clientHeight;
        if (w <= 0 || h <= 0) return;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      window.addEventListener('resize', resize);
      resize();

      // ── Animation Loop and Resource Saving ──
      let animId = null;
      let isRendering = false;
      let isFocused = true;
      let frameCount = 0;
      let lastFpsTime = performance.now();

      function renderFrame() {
        if (!isRendering) return;
        animId = requestAnimationFrame(renderFrame);

        currentQuat.slerp(liveQuat, 0.35);
        gamepadGroup.quaternion.copy(currentQuat);
        cubeGroup.quaternion.copy(currentQuat);

        renderer.render(scene, camera);

        frameCount++;
        const now = performance.now();
        if (now - lastFpsTime >= 1000) {
          const fps = Math.round((frameCount * 1000) / (now - lastFpsTime));
          if (fpsCounter) fpsCounter.textContent = `${fps} fps`;
          frameCount = 0;
          lastFpsTime = now;
        }
      }

      function startRendering() {
        if (isRendering) return;
        isRendering = true;
        canvas.classList.remove('blurred');
        ecoOverlay.classList.remove('visible');
        currentQuat.copy(liveQuat);
        gamepadGroup.quaternion.copy(currentQuat);
        cubeGroup.quaternion.copy(currentQuat);
        lastFpsTime = performance.now();
        frameCount = 0;
        animId = requestAnimationFrame(renderFrame);
      }

      function stopRendering(showEcoOverlay = false) {
        if (!isRendering) return;
        isRendering = false;
        if (animId) {
          cancelAnimationFrame(animId);
          animId = null;
        }
        if (fpsCounter) fpsCounter.textContent = '0 fps';
        if (showEcoOverlay) {
          canvas.classList.add('blurred');
          ecoOverlay.classList.add('visible');
        }
      }

      function updatePowerState() {
        const isHidden = document.hidden;
        const ecoEnabled = ecoToggle.checked;

        if (isHidden) {
          stopRendering(false);
        } else if (!isFocused && ecoEnabled) {
          stopRendering(true);
        } else {
          startRendering();
        }
      }

      document.addEventListener('visibilitychange', updatePowerState);

      window.addEventListener('focus', () => {
        isFocused = true;
        updatePowerState();
      });

      window.addEventListener('blur', () => {
        isFocused = false;
        updatePowerState();
      });

      ecoOverlay.addEventListener('click', () => {
        window.focus();
        isFocused = true;
        updatePowerState();
      });

      ecoToggle.addEventListener('change', () => {
        localStorage.setItem('gb_debug_eco', ecoToggle.checked ? 'true' : 'false');
        updatePowerState();
      });

      if (localStorage.getItem('gb_debug_eco') === 'false') {
        ecoToggle.checked = false;
      }

      // Initial Theme, Lang, and Render Setup
      applyLang(currentLang);
      applyTheme(currentTheme, false);
      startRendering();
      window.focus();

      // Immediate HTTP sync fetch on startup
      fetch('http://127.0.0.1:8080/livedebug/theme')
        .then(r => r.json())
        .then(d => {
          if (d && d.theme && d.theme !== currentTheme) applyTheme(d.theme, false);
        })
        .catch(() => {});

      fetch('http://127.0.0.1:8080/livedebug/lang')
        .then(r => r.json())
        .then(d => {
          if (d && d.lang && d.lang !== currentLang) applyLang(d.lang);
        })
        .catch(() => {});

      // ── Recenter Action ──
      function doRecenter() {
        liveQuat.set(0, 0, 0, 1);
        currentQuat.set(0, 0, 0, 1);
        gamepadGroup.quaternion.set(0, 0, 0, 1);
        cubeGroup.quaternion.set(0, 0, 0, 1);

        if (ws && ws.readyState === WebSocket.OPEN) {
          try { ws.send(JSON.stringify({ action: 'recenter' })); } catch (e) {}
        }
        fetch('http://127.0.0.1:8080/livedebug/recenter', { method: 'POST' }).catch(() => {});

        if (window.go?.main?.LiveDebugApp?.ResetAHRS) {
          try { window.go.main.LiveDebugApp.ResetAHRS(); } catch (e) {}
        }
      }

      btnRecenter.addEventListener('click', doRecenter);

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          doRecenter();
        }
      });

      // ── WebSocket Real-time Quaternion Stream ──
      let ws = null;
      let reconnectTimer = null;

      function updateStatus(connected) {
        if (!statusDot || !statusCapsule) return;
        if (connected) {
          statusCapsule.className = 'status-capsule online';
          statusDot.style.background = 'var(--dot-online)';
          statusDot.style.boxShadow = '0 0 8px var(--dot-online)';
        } else {
          statusCapsule.className = 'status-capsule offline';
          statusDot.style.background = 'var(--dot-offline)';
          statusDot.style.boxShadow = '0 0 8px var(--dot-offline)';
          if (fpsCounter) {
            const dict = DICTIONARY[currentLang] || DICTIONARY.ru;
            fpsCounter.textContent = dict["live_debug.status_offline"] || "offline";
          }
        }
      }

      function connectWebSocket() {
        if (reconnectTimer) {
          clearTimeout(reconnectTimer);
          reconnectTimer = null;
        }

        const wsUrl = 'ws://127.0.0.1:8080/livedebug/ws';

        try {
          ws = new WebSocket(wsUrl);
        } catch (err) {
          updateStatus(false);
          scheduleReconnect();
          return;
        }

        ws.onopen = () => {
          updateStatus(true);
        };

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);

            // Shutdown signal from parent application
            if (data.action === 'shutdown') {
              if (window.runtime?.Quit) {
                window.runtime.Quit();
              } else {
                window.close();
              }
              return;
            }

            // Sync frame on connection
            if (data.type === 'sync') {
              if (data.theme && data.theme !== currentTheme) applyTheme(data.theme, false);
              if (data.lang && data.lang !== currentLang) applyLang(data.lang);
              return;
            }

            // Broadcasted theme change from main window
            if (data.type === 'theme') {
              if (data.theme && data.theme !== currentTheme) applyTheme(data.theme, false);
              return;
            }

            // Broadcasted language change from main window
            if (data.type === 'lang') {
              if (data.lang && data.lang !== currentLang) applyLang(data.lang);
              return;
            }

            // Telemetry quaternion frame
            const q0 = Number(data.q0);
            const q1 = Number(data.q1);
            const q2 = Number(data.q2);
            const q3 = Number(data.q3);

            if (!isNaN(q0) && !isNaN(q1) && !isNaN(q2) && !isNaN(q3) &&
                (q0 !== 0 || q1 !== 0 || q2 !== 0 || q3 !== 0)) {
              // Three.js coordinates: -q1 (pitch), -q2 (yaw), q3 (roll), q0 (w)
              liveQuat.set(-q1, -q2, q3, q0);
              liveQuat.normalize();
            }
          } catch (e) {}
        };

        ws.onclose = () => {
          updateStatus(false);
          scheduleReconnect();
        };

        ws.onerror = () => {
          updateStatus(false);
          try { ws.close(); } catch (e) {}
        };
      }

      function scheduleReconnect() {
        if (!reconnectTimer) {
          reconnectTimer = setTimeout(connectWebSocket, 1500);
        }
      }

      connectWebSocket();
    })();
  </script>
</body>
</html>
