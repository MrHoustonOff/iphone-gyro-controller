<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GyroBridge Controller</title>
  <style>
    * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; }
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f111a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { margin: 8px 0; font-size: 24px; color: #38bdf8; text-align: center; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      background: #1e293b;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
    }
    .dot-ok { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .dot-warn { background: #f59e0b; }
    .dot-err { background: #ef4444; }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin: 6px 0;
      font-size: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .btn {
      width: 100%;
      max-width: 360px;
      padding: 18px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 16px;
      border: none;
      background: #38bdf8;
      color: #0f172a;
      cursor: pointer;
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
      transition: transform 0.1s, background 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-secondary {
      background: #334155;
      color: #f8fafc;
      box-shadow: none;
      font-size: 14px;
      padding: 12px;
    }
    #log-box {
      width: 100%;
      max-width: 360px;
      height: 120px;
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 10px;
      font-size: 11px;
      font-family: monospace;
      color: #94a3b8;
      overflow-y: auto;
    }
    .log-line { margin: 2px 0; }
    .log-ok { color: #4ade80; }
    .log-err { color: #f87171; }
  </style>
</head>
<body>

  <h1>GyroBridge</h1>
  <div id="ws-badge" class="status-badge">
    <span id="badge-dot" class="badge-dot dot-warn"></span>
    <span id="badge-text">Connecting WSS...</span>
  </div>

  <button id="perm-btn" class="btn">Enable Sensors</button>

  <div class="card">
    <div style="font-weight: 700; margin-bottom: 8px; color: #94a3b8;">ORIENTATION</div>
    <div class="row"><span>Alpha (Yaw):</span><span id="v-alpha">0.0</span></div>
    <div class="row"><span>Beta (Pitch):</span><span id="v-beta">0.0</span></div>
    <div class="row"><span>Gamma (Roll):</span><span id="v-gamma">0.0</span></div>
  </div>

  <div class="card">
    <div style="font-weight: 700; margin-bottom: 8px; color: #94a3b8;">ACCELEROMETER</div>
    <div class="row"><span>Acc X:</span><span id="v-ax">0.0</span></div>
    <div class="row"><span>Acc Y:</span><span id="v-ay">0.0</span></div>
    <div class="row"><span>Acc Z:</span><span id="v-az">0.0</span></div>
    <div class="row" style="margin-top: 8px; border-top: 1px solid #334155; padding-top: 6px;">
      <span>Polling Rate:</span><span id="v-rate" style="color: #4ade80; font-weight: bold;">0.0 Hz</span>
    </div>
    <div class="row">
      <span>Frames Sent:</span><span id="v-frames">0</span>
    </div>
  </div>

  <div id="log-box"></div>

  <script>
    const logBox = document.getElementById('log-box');
    function log(msg, type='') {
      const line = document.createElement('div');
      line.className = 'log-line ' + (type ? 'log-' + type : '');
      line.textContent = `[${new Date().toTimeString().split(' ')[0]}] ${msg}`;
      logBox.appendChild(line);
      logBox.scrollTop = logBox.scrollHeight;
    }

    log('Loaded context: isSecureContext=' + window.isSecureContext, window.isSecureContext ? 'ok' : 'err');

    // 1. High-Performance WebSocket Connection (Binary)
    let ws = null;
    let wsReady = false;
    const badgeText = document.getElementById('badge-text');
    const badgeDot = document.getElementById('badge-dot');

    // Reusable 46-byte ArrayBuffer to eliminate memory allocation & GC
    // Layout:
    // [0..3]:   uint32 timestamp (ms & 0xFFFFFFFF)
    // [4..7]:   float32 rotX (°/s - pitch rate for DSU)
    // [8..11]:  float32 rotY (°/s - roll rate for DSU)
    // [12..15]: float32 rotZ (°/s - yaw rate for DSU)
    // [16..19]: float32 qx (quaternion x)
    // [20..23]: float32 qy (quaternion y)
    // [24..27]: float32 qz (quaternion z)
    // [28..31]: float32 qw (quaternion w)
    // [32..35]: float32 accX (g for DSU)
    // [36..39]: float32 accY (g for DSU)
    // [40..43]: float32 accZ (g for DSU)
    // [44..45]: uint16 buttons/flags bitmask
    const binBuffer = new ArrayBuffer(46);
    const binView = new DataView(binBuffer);

    function connectWSS() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const url = `${proto}//${location.host}/ws`;
      log('Connecting to ' + url);

      try {
        ws = new WebSocket(url);
        ws.binaryType = 'arraybuffer';

        ws.onopen = () => {
          wsReady = true;
          badgeText.textContent = 'CONNECTED (WSS 46B)';
          badgeDot.className = 'badge-dot dot-ok';
          log('Binary WSS (46 bytes) connected!', 'ok');
        };
        ws.onerror = (e) => {
          badgeText.textContent = 'WSS ERROR';
          badgeDot.className = 'badge-dot dot-err';
          log('WSS connection failed', 'err');
        };
        ws.onclose = () => {
          wsReady = false;
          badgeText.textContent = 'DISCONNECTED';
          badgeDot.className = 'badge-dot dot-warn';
          log('WSS closed, reconnecting in 2s...');
          setTimeout(connectWSS, 2000);
        };
      } catch (err) {
        log('WS error: ' + err.message, 'err');
      }
    }
    connectWSS();

    // 2. Sensor capture & zero-copy stream
    let frameCount = 0;
    let hzCounter = 0;
    let lastHzTime = performance.now();

    const vRate = document.getElementById('v-rate');
    const vFrames = document.getElementById('v-frames');
    const vAlpha = document.getElementById('v-alpha');
    const vBeta = document.getElementById('v-beta');
    const vGamma = document.getElementById('v-gamma');
    const vAx = document.getElementById('v-ax');
    const vAy = document.getElementById('v-ay');
    const vAz = document.getElementById('v-az');

    // Telemetry state
    let rotX = 0, rotY = 0, rotZ = 0;
    let qx = 0, qy = 0, qz = 0, qw = 1;
    let accX = 0, accY = 0, accZ = 0;
    let buttons = 0;
    const degToRad = Math.PI / 180;

    function onOrientation(e) {
      const alpha = e.alpha || 0;
      const beta = e.beta || 0;
      const gamma = e.gamma || 0;

      vAlpha.textContent = alpha.toFixed(1);
      vBeta.textContent = beta.toFixed(1);
      vGamma.textContent = gamma.toFixed(1);

      // Convert W3C Tait-Bryan Z-X'-Y'' angles to unit Quaternion
      const _x = beta * degToRad;
      const _y = gamma * degToRad;
      const _z = alpha * degToRad;

      const cX = Math.cos(_x / 2), sX = Math.sin(_x / 2);
      const cY = Math.cos(_y / 2), sY = Math.sin(_y / 2);
      const cZ = Math.cos(_z / 2), sZ = Math.sin(_z / 2);

      qx = sX * cY * cZ - cX * sY * sZ;
      qy = cX * sY * cZ + sX * cY * sZ;
      qz = cX * cY * sZ + sX * sY * cZ;
      qw = cX * cY * cZ - sX * sY * sZ;

      queueSend();
    }

    const G_CONST = 9.80665;
    function onMotion(e) {
      // Rotation rate (°/s for Cemuhook DSU)
      if (e.rotationRate) {
        if (e.rotationRate.beta != null) rotX = e.rotationRate.beta;
        if (e.rotationRate.gamma != null) rotY = e.rotationRate.gamma;
        if (e.rotationRate.alpha != null) rotZ = e.rotationRate.alpha;
      }

      // Acceleration in g (1g = 9.80665 m/s² for Cemuhook DSU)
      const a = e.accelerationIncludingGravity || e.acceleration;
      if (a) {
        if (a.x != null) accX = a.x / G_CONST;
        if (a.y != null) accY = a.y / G_CONST;
        if (a.z != null) accZ = a.z / G_CONST;

        vAx.textContent = accX.toFixed(2) + 'g';
        vAy.textContent = accY.toFixed(2) + 'g';
        vAz.textContent = accZ.toFixed(2) + 'g';
      }
      queueSend();
    }

    function queueSend() {
      // Avoid TCP buffer backlog: send only if socket buffer is drained
      if (!wsReady || ws.readyState !== WebSocket.OPEN || ws.bufferedAmount > 0) {
        return;
      }

      const now32 = (Date.now() & 0xFFFFFFFF) >>> 0;
      binView.setUint32(0, now32, true);
      binView.setFloat32(4, rotX, true);
      binView.setFloat32(8, rotY, true);
      binView.setFloat32(12, rotZ, true);
      binView.setFloat32(16, qx, true);
      binView.setFloat32(20, qy, true);
      binView.setFloat32(24, qz, true);
      binView.setFloat32(28, qw, true);
      binView.setFloat32(32, accX, true);
      binView.setFloat32(36, accY, true);
      binView.setFloat32(40, accZ, true);
      binView.setUint16(44, buttons, true);

      ws.send(binBuffer);

      frameCount++;
      hzCounter++;
      vFrames.textContent = frameCount;

      // Frequency calculation every 500ms
      const pNow = performance.now();
      const elapsed = pNow - lastHzTime;
      if (elapsed >= 500) {
        const hz = (hzCounter * 1000) / elapsed;
        vRate.textContent = hz.toFixed(1) + ' Hz';
        vRate.style.color = hz >= 50 ? '#4ade80' : (hz >= 30 ? '#facc15' : '#f87171');
        hzCounter = 0;
        lastHzTime = pNow;
      }
    }

    function attachListeners() {
      log('Attaching device sensor listeners...');
      window.addEventListener('deviceorientation', onOrientation, true);
      window.addEventListener('devicemotion', onMotion, true);
      log('Sensors active! Move device to stream.', 'ok');
    }

    const permBtn = document.getElementById('perm-btn');
    permBtn.addEventListener('click', async () => {
      log('Permission button clicked');

      // iOS 13+ DeviceMotionEvent permission check
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
          log('Requesting DeviceMotionEvent permission...');
          const resp = await DeviceMotionEvent.requestPermission();
          log('Motion permission: ' + resp, resp === 'granted' ? 'ok' : 'err');
          if (resp === 'granted') {
            attachListeners();
            permBtn.textContent = 'Sensors Active ✓';
            permBtn.style.background = '#22c55e';
          } else {
            alert('Sensor permission denied: ' + resp);
          }
        } catch (err) {
          log('Permission error: ' + err.message, 'err');
          alert('Error: ' + err.message);
        }
      } else if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const resp = await DeviceOrientationEvent.requestPermission();
          log('Orientation permission: ' + resp, resp === 'granted' ? 'ok' : 'err');
          if (resp === 'granted') {
            attachListeners();
          }
        } catch (err) {
          log('Permission error: ' + err.message, 'err');
        }
      } else {
        log('Standard permission flow (Android/Chrome)');
        attachListeners();
        permBtn.textContent = 'Sensors Active ✓';
        permBtn.style.background = '#22c55e';
      }
    });

    // Auto-listen for Android Chrome
    attachListeners();
  </script>
</body>
</html>
