<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GyroBridge</title>
  <style>
    :root {
      --bg: #070b14;
      --primary: #38bdf8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f1f5f9;
      --card-bg: rgba(18, 26, 44, 0.9);
      --border: rgba(56, 189, 248, 0.2);
    }

    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #111e38 0%, var(--bg) 75%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 24px);
    }

    .app-wrap {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .header-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 30%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin-bottom: 10px;
    }

    /* ── The 3 Primary Buttons ── */
    .btn {
      width: 100%;
      min-height: 64px;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 800;
      border-radius: 16px;
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s ease;
      touch-action: manipulation;
      text-align: center;
    }
    .btn:active {
      transform: scale(0.97);
    }

    /* Button 1: Permissions */
    .btn-perm {
      background: rgba(30, 41, 59, 0.7);
      color: #94a3b8;
      border-color: rgba(255, 255, 255, 0.1);
    }
    .btn-perm.granted {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.4);
    }

    /* Button 2: Stream Status / Toggle */
    .btn-stream {
      background: rgba(30, 41, 59, 0.8);
      color: #94a3b8;
      border-color: rgba(255, 255, 255, 0.1);
    }
    /* Streaming OK - Glowing Active Green */
    .btn-stream.active {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      box-shadow: 0 0 24px rgba(16, 185, 129, 0.5);
      border-color: #34d399;
      animation: pulse-green 2s infinite ease-in-out;
    }
    /* Reconnecting / Connecting - Glowing Orange */
    .btn-stream.reconnecting {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      box-shadow: 0 0 24px rgba(245, 158, 11, 0.5);
      border-color: #fbbf24;
      animation: pulse-orange 1.5s infinite ease-in-out;
    }
    @keyframes pulse-green {
      0%, 100% { box-shadow: 0 0 16px rgba(16, 185, 129, 0.4); }
      50% { box-shadow: 0 0 28px rgba(16, 185, 129, 0.7); }
    }
    @keyframes pulse-orange {
      0%, 100% { box-shadow: 0 0 16px rgba(245, 158, 11, 0.4); }
      50% { box-shadow: 0 0 28px rgba(245, 158, 11, 0.7); }
    }

    /* Button 3: Auto-Calibration */
    .btn-calib {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      box-shadow: 0 4px 18px rgba(37, 99, 235, 0.4);
    }

    /* ── Minimal Auto-Calibration Modal ── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 15, 0.9);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      width: 100%;
      max-width: 340px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }
    .modal-instruction {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.5;
      color: #e2e8f0;
    }
    .modal-instruction strong {
      color: var(--primary);
    }
    .progress-bar-wrap {
      width: 100%;
      height: 8px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #10b981);
      transition: width 0.05s linear;
    }
  </style>
</head>
<body>

<div class="app-wrap">
  <h1 class="header-title">GyroBridge</h1>

  <!-- 1. Permission Request Button -->
  <button id="btn-perm" class="btn btn-perm">
    <span>🛡️</span>
    <span id="txt-perm">Запрос разрешения</span>
  </button>

  <!-- 2. Auto-Calibration Button -->
  <button id="btn-calib" class="btn btn-calib">
    <span>🎯</span>
    <span>Автокалибровка</span>
  </button>

  <!-- 3. Transmission Start / Status Button -->
  <button id="btn-stream" class="btn btn-stream reconnecting">
    <span id="icon-stream">⏳</span>
    <span id="txt-stream">ПОДКЛЮЧЕНИЕ...</span>
  </button>
</div>

<!-- Auto-Calibration Modal -->
<div class="modal-backdrop" id="modal-calib">
  <div class="modal-card">
    <div style="font-size: 32px;">📱</div>
    <div class="modal-instruction" id="modal-msg">
      Положите телефон <strong>экраном вверх</strong> и <strong>вперед к камере</strong>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-bar" id="calib-progress"></div>
    </div>

    <button id="btn-start-calib" class="btn btn-calib" style="min-height:50px; margin-top:8px;">
      Зафиксировать (2 сек)
    </button>
    <button id="btn-close-modal" class="btn btn-perm" style="min-height:44px; padding:10px;">
      Отмена
    </button>
  </div>
</div>

<script>
'use strict';

// ─────────────────────────────────────────────────────────────────────────────
// Fixed Preset: "Горизонтально: экраном вверх, перед к камере"
// ─────────────────────────────────────────────────────────────────────────────
// Phone coordinates when flat on table, screen UP:
// - Phone X: Right edge
// - Phone Y: Top edge (forward towards camera/monitor)
// - Phone Z: Screen normal (pointing UP to ceiling)
//
// Target Gamepad coordinates:
// - Pitch (X, Red)   = +Phone X (rotation around X)
// - Yaw   (Y, Green) = +Phone Z (vertical axis / spinning on table)
// - Roll  (Z, Blue)  = -Phone Y (tilting sideways, right-handed SO(3), det = +1)
// - Accel:
//   - Accel X = +Phone X
//   - Accel Y = +Phone Z (+1.0g along UP, controller lies flat!)
//   - Accel Z = -Phone Y
// ─────────────────────────────────────────────────────────────────────────────

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

const btnPerm       = document.getElementById('btn-perm');
const txtPerm       = document.getElementById('txt-perm');
const btnCalib      = document.getElementById('btn-calib');
const btnStream     = document.getElementById('btn-stream');
const txtStream     = document.getElementById('txt-stream');
const iconStream    = document.getElementById('icon-stream');

const modalCalib    = document.getElementById('modal-calib');
const btnStartCalib = document.getElementById('btn-start-calib');
const btnCloseModal = document.getElementById('btn-close-modal');
const calibProgress = document.getElementById('calib-progress');
const modalMsg      = document.getElementById('modal-msg');

let isStreamingEnabled = true;
let isConnected = false;
let isSamplingCalib = false;

// ─────────────────────────────────────────────────────────────────────────────
// 1. Gyro Bias & ZUPT (Zero-Velocity Update)
// ─────────────────────────────────────────────────────────────────────────────
const G_CONST = 9.80665;
const DEG2RAD_HALF = Math.PI / 360;

const savedBias = JSON.parse(localStorage.getItem('gb_bias_up') || '{"x":0,"y":0,"z":0}');
let biasX = savedBias.x, biasY = savedBias.y, biasZ = savedBias.z;

let zeroYawOffset = 0;
let rawGyr = { x: 0, y: 0, z: 0 };
let rawAcc = { x: 0, y: 0, z: 0 };

let curAlpha = 0, curBeta = 0, curGamma = 0;
let calibAccSamples = [];
let calibGyrSamples = [];

const accelWin = [];
let stillDetected = false;

function updateZUPT(ax, ay, az) {
  accelWin.push({ x: ax, y: ay, z: az });
  if (accelWin.length > 10) accelWin.shift();
  if (accelWin.length < 10) return;

  let mx = 0, my = 0, mz = 0;
  for (const s of accelWin) { mx += s.x; my += s.y; mz += s.z; }
  mx /= 10; my /= 10; mz /= 10;

  let v = 0;
  for (const s of accelWin) {
    const dx = s.x - mx, dy = s.y - my, dz = s.z - mz;
    v += dx*dx + dy*dy + dz*dz;
  }
  stillDetected = (v / 10) < 0.00018;
}

function applyBias(rx, ry, rz) {
  if (stillDetected) {
    biasX += (rx - biasX) * 0.20;
    biasY += (ry - biasY) * 0.20;
    biasZ += (rz - biasZ) * 0.20;
    return [0, 0, 0];
  }

  let cx = rx - biasX;
  let cy = ry - biasY;
  let cz = rz - biasZ;

  biasX += (rx - biasX) * 0.001;
  biasY += (ry - biasY) * 0.001;
  biasZ += (rz - biasZ) * 0.001;

  if (Math.abs(cx) < 0.25) cx = 0;
  if (Math.abs(cy) < 0.25) cy = 0;
  if (Math.abs(cz) < 0.25) cz = 0;

  return [cx, cy, cz];
}

// ─────────────────────────────────────────────────────────────────────────────
// 2. WebSocket & Button 2 (Transmission Status / Toggle)
// ─────────────────────────────────────────────────────────────────────────────
let ws = null;
const binBuffer = new ArrayBuffer(46);
const binView   = new DataView(binBuffer);

function updateStreamButtonUI() {
  if (!isStreamingEnabled) {
    btnStream.className = 'btn btn-stream';
    txtStream.textContent = 'СТАРТ ПЕРЕДАЧИ';
    iconStream.textContent = '▶️';
  } else if (isConnected) {
    btnStream.className = 'btn btn-stream active';
    txtStream.textContent = 'ПЕРЕДАЧА АКТИВНА';
    iconStream.textContent = '🟢';
  } else {
    btnStream.className = 'btn btn-stream reconnecting';
    txtStream.textContent = 'ПЕРЕПОДКЛЮЧЕНИЕ...';
    iconStream.textContent = '⏳';
  }
}

function connectWSS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    isConnected = true;
    updateStreamButtonUI();
  };

  ws.onclose = () => {
    isConnected = false;
    updateStreamButtonUI();
    setTimeout(connectWSS, 2000);
  };

  ws.onerror = () => {
    isConnected = false;
    updateStreamButtonUI();
  };
}
connectWSS();

btnStream.addEventListener('click', () => {
  isStreamingEnabled = !isStreamingEnabled;
  updateStreamButtonUI();
});

// ─────────────────────────────────────────────────────────────────────────────
// 3. Sensor Streaming (Strict Horizontal Screen-Up SO(3) Frame)
// ─────────────────────────────────────────────────────────────────────────────
let outQx = 0, outQy = 0, outQz = 0, outQw = 1;
let dsuPitch = 0, dsuYaw = 0, dsuRoll = 0;
let dsuAccX = 0, dsuAccY = 0, dsuAccZ = 0;
let lastMotionTime = 0;

function onOrientation(e) {
  curAlpha = e.alpha || 0;
  curBeta  = e.beta  || 0;
  curGamma = e.gamma || 0;

  const a = ((curAlpha - zeroYawOffset + 360) % 360) * DEG2RAD_HALF;
  const b = curBeta  * DEG2RAD_HALF;
  const c = curGamma * DEG2RAD_HALF;

  const cA = Math.cos(a), sA = Math.sin(a);
  const cB = Math.cos(b), sB = Math.sin(b);
  const cC = Math.cos(c), sC = Math.sin(c);

  const qw = cA * cB * cC + sA * sB * sC;
  const qx = cA * sB * cC + sA * cB * sC;
  const qy = -sA * sB * cC + cA * cB * sC;
  const qz = sA * cB * cC - cA * sB * sC;

  // SO(3) mapping for screen up: Pitch = +X, Yaw = +Z, Roll = -Y
  outQx = qx;
  outQy = qz;
  outQz = -qy;
  outQw = qw;

  if (outQw < 0) {
    outQx = -outQx; outQy = -outQy; outQz = -outQz; outQw = -outQw;
  }

  if (performance.now() - lastMotionTime > 200) sendFrame();
}

function onMotion(e) {
  lastMotionTime = performance.now();

  let rx = 0, ry = 0, rz = 0;
  if (e.rotationRate) {
    rx = e.rotationRate.beta  || 0;
    ry = e.rotationRate.gamma || 0;
    rz = e.rotationRate.alpha || 0;
  }
  rawGyr = { x: rx, y: ry, z: rz };

  const a = e.accelerationIncludingGravity || e.acceleration;
  let ax = 0, ay = 0, az = 0;
  if (a) {
    ax = (a.x != null ? a.x / G_CONST : 0);
    ay = (a.y != null ? a.y / G_CONST : 0);
    az = (a.z != null ? a.z / G_CONST : 0);
  }
  const accSign = isIOS ? -1 : 1;
  rawAcc = { x: ax * accSign, y: ay * accSign, z: az * accSign };

  updateZUPT(rawAcc.x, rawAcc.y, rawAcc.z);

  if (isSamplingCalib) {
    calibAccSamples.push({ ...rawAcc });
    calibGyrSamples.push({ ...rawGyr });
    return;
  }

  const [cx, cy, cz] = applyBias(rx, ry, rz);

  // Screen Up mapping:
  // Pitch = +X (nose up/down)
  // Yaw   = +Z (spinning on table)
  // Roll  = -Y (tilting sideways)
  dsuPitch = cx;
  dsuYaw   = cz;
  dsuRoll  = -cy;

  // Accel: normal force along Z points UP (into Y in DSU!)
  dsuAccX = rawAcc.x;
  dsuAccY = rawAcc.z;
  dsuAccZ = -rawAcc.y;

  sendFrame();
}

function sendFrame() {
  if (!isStreamingEnabled || !isConnected || !ws || ws.readyState !== WebSocket.OPEN || ws.bufferedAmount > 0) return;

  binView.setUint32(0,  (Date.now() & 0xFFFFFFFF) >>> 0, true);
  binView.setFloat32(4,  dsuPitch, true); // Pitch (RotX) -> offset 68
  binView.setFloat32(8,  dsuYaw,   true); // Yaw   (RotY) -> offset 72
  binView.setFloat32(12, dsuRoll,  true); // Roll  (RotZ) -> offset 76
  binView.setFloat32(16, outQx,    true);
  binView.setFloat32(20, outQy,    true);
  binView.setFloat32(24, outQz,    true);
  binView.setFloat32(28, outQw,    true);
  binView.setFloat32(32, dsuAccX,  true);
  binView.setFloat32(36, dsuAccY,  true);
  binView.setFloat32(40, dsuAccZ,  true);
  binView.setUint16(44,  0,        true);
  ws.send(binBuffer);
}

// ─────────────────────────────────────────────────────────────────────────────
// 4. Auto-Calibration (Prompt: Screen UP, Forward to Camera)
// ─────────────────────────────────────────────────────────────────────────────
btnCalib.addEventListener('click', () => {
  modalCalib.classList.add('open');
  calibProgress.style.width = '0%';
  btnStartCalib.disabled = false;
  btnStartCalib.textContent = 'Зафиксировать (2 сек)';
  modalMsg.innerHTML = 'Положите телефон <strong>экраном вверх</strong> и <strong>вперед к камере</strong>';
});

btnCloseModal.addEventListener('click', () => {
  isSamplingCalib = false;
  modalCalib.classList.remove('open');
});

btnStartCalib.addEventListener('click', () => {
  isSamplingCalib = true;
  calibAccSamples = [];
  calibGyrSamples = [];
  btnStartCalib.disabled = true;
  btnStartCalib.textContent = 'Идет калибровка...';

  const startTime = performance.now();
  const DURATION = 2000;

  const timer = setInterval(() => {
    const elapsed = performance.now() - startTime;
    const p = Math.min(1, elapsed / DURATION);
    calibProgress.style.width = (p * 100).toFixed(0) + '%';

    if (p >= 1) {
      clearInterval(timer);
      isSamplingCalib = false;

      if (calibGyrSamples.length > 10) {
        let gx = 0, gy = 0, gz = 0;
        for (const s of calibGyrSamples) { gx += s.x; gy += s.y; gz += s.z; }
        biasX = gx / calibGyrSamples.length;
        biasY = gy / calibGyrSamples.length;
        biasZ = gz / calibGyrSamples.length;
        localStorage.setItem('gb_bias_up', JSON.stringify({ x: biasX, y: biasY, z: biasZ }));
      }

      zeroYawOffset = curAlpha; // Tare heading
      modalMsg.innerHTML = '<span style="color:#10b981;">✅ Калибровка завершена!</span>';
      setTimeout(() => {
        modalCalib.classList.remove('open');
      }, 600);
    }
  }, 50);
});

// ─────────────────────────────────────────────────────────────────────────────
// 5. Permission Request Button & Sensor Initialization
// ─────────────────────────────────────────────────────────────────────────────
function initSensors() {
  window.addEventListener('deviceorientation', onOrientation, true);
  window.addEventListener('devicemotion', onMotion, true);
  btnPerm.classList.add('granted');
  txtPerm.textContent = 'Датчики включены ✓';
  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').catch(() => {});
  }
}

btnPerm.addEventListener('click', async () => {
  if (typeof DeviceMotionEvent !== 'undefined' &&
      typeof DeviceMotionEvent.requestPermission === 'function') {
    try {
      const resp = await DeviceMotionEvent.requestPermission();
      if (resp === 'granted') {
        initSensors();
      } else {
        txtPerm.textContent = 'Доступ запрещен';
      }
    } catch (err) {
      txtPerm.textContent = 'Ошибка доступа';
    }
  } else {
    initSensors();
  }
});

// Auto-start for Android
initSensors();

</script>
</body>
</html>
