name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for release (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release GyroBridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Build Windows Binary (gyrobridge.exe)
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -ldflags="-s -w" -o gyrobridge.exe ./cmd/gyrobridge

      - name: Publish Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }} — VIP Functionality Ready
          body: |
            Готов VIP функционал. Базовый скелет, DSU Cemuhook сервер и математика ориентации запущены.
            Ничего толком не тестировалось, всё сделано на живую нитку. Далее начинаются куда более сложные процессы.

            ### Файлы релиза:
            - **gyrobridge.exe** — единый исполняемый файл для Windows (без внешних зависимостей).
          files: |
            gyrobridge.exe
          draft: false
          prerelease: false
